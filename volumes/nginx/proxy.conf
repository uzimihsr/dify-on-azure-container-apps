# https://github.com/langgenius/dify/blob/main/docker/nginx/proxy.conf.template
# https://github.com/langgenius/dify/blob/main/docker/.env.example

proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# proxy_set_header X-Forwarded-Port $server_port; # これがあるとapiコンテナへの転送が失敗する
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_buffering off;
proxy_read_timeout 3600s; # ${NGINX_PROXY_READ_TIMEOUT};
proxy_send_timeout 3600s; # ${NGINX_PROXY_SEND_TIMEOUT};
